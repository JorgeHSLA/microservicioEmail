openapi: 3.0.3
info:
  title: Mail Microservice
  version: 1.0.0
  description: |
    Transactional email microservice for the TuViaje.com platform.
    Sends emails via Gmail SMTP using a Gmail App Password and Jinja2 templates.
    Stateless: no persistence, no queue, no retry.
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: emails
    description: Transactional email sending
  - name: health
    description: Service liveness checks
paths:
  /api/v1/emails:
    post:
      tags: [emails]
      summary: Send a transactional email
      description: |
        Sends an email to one or more recipients using the configured Gmail
        SMTP account. The body is sent as-is (no template rendering by default).
      operationId: sendEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          description: Email accepted by the SMTP server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/SmtpError'
  /api/v1/health:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: getHealth
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    EmailRequest:
      type: object
      required: [toEmails, subject, body]
      description: |
        Email send request. The `toEmails` field is the canonical camelCase
        name (aligned with banco-service). For backward compatibility, the
        service also accepts the legacy snake_case `to_emails` on input
        (via Pydantic `alias="toEmails"` + `populate_by_name=True`). New
        clients should use `toEmails`.
      properties:
        toEmails:
          type: array
          minItems: 1
          items:
            type: string
            format: email
          description: |
            Recipient email addresses (RFC-validated). Canonical name is
            `toEmails`; legacy `to_emails` is also accepted on input.
          example:
            - "jorgesierralaiton@gmail.com"
            - "otro@example.com"
        subject:
          type: string
          minLength: 1
          maxLength: 255
          example: "Confirmación de reserva TuViaje.com"
        body:
          type: string
          minLength: 1
          example: "Tu reserva BOG-MDE ha sido confirmada. Código: ABC123."
    EmailResponse:
      type: object
      required: [status, recipients]
      properties:
        status:
          type: string
          enum: [sent]
          example: sent
        recipients:
          type: array
          items:
            type: string
            format: email
          example:
            - "jorgesierralaiton@gmail.com"
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
          example: ok
        service:
          type: string
          enum: [mail-service]
          example: mail-service
    HttpError:
      type: object
      required: [detail]
      properties:
        detail:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                properties:
                  type:    { type: string }
                  loc:     { type: array, items: { type: string } }
                  msg:     { type: string }
                  input:   {}
  responses:
    ValidationError:
      description: Request body failed FastAPI/Pydantic validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
          examples:
            invalidEmail:
              value:
                detail:
                  - type: value_error
                    loc: [body, toEmails, 0]
                    msg: "value is not a valid email address"
                    input: "no-es-un-email"
    SmtpError:
      description: SMTP send failed (auth error, timeout, host unreachable, template missing).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
          examples:
            authError:
              value:
                detail: "SMTP authentication failed: Username and Password not accepted"
            timeout:
              value:
                detail: "SMTP send failed: timed out"
