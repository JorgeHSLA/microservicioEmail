{% extends "base.html" %}

{% block content %}
<h1 style="color: #1e40af; font-size: 22px; margin-top: 0; margin-bottom: 16px; font-family: Arial, Helvetica, sans-serif;">{{ subject }}</h1>
<p style="color: #374151; font-size: 16px; line-height: 1.6; margin: 0 0 24px 0; font-family: Arial, Helvetica, sans-serif;">{{ body }}</p>
<hr style="border: none; border-top: 1px solid #e5e7eb; margin: 24px 0;">
<p style="color: #6b7280; font-size: 14px; margin: 0; font-family: Arial, Helvetica, sans-serif;">Gracias por confiar en {{ platform_name }}.</p>
{% endblock %}
